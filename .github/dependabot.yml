# Dependabot configuration template — Veteran Vectors
#
# This file is the canonical config template for all VV repos.
# Every consumer repo copies this into `.github/dependabot.yml` via
# `shared/scripts/sync-dependabot.sh`.
#
# Do NOT edit `.github/dependabot.yml` directly — changes will be
# overwritten on next sync. Edit THIS file here in templates-skills,
# push, then re-run the sync script across consumer repos.
#
# Coverage:
#   - npm: root + common subproject paths (app/, website/, site/, web/, server/, api/)
#   - pip: root + scripts/
#   - GitHub Actions: root
#
# Grouping: patch + minor bumps are grouped into one PR per ecosystem
# so the queue stays small. Major bumps get their own PR so we review
# them before merging.

version: 2
updates:
  # ── npm / yarn ─────────────────────────────────────────
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/app"
      - "/website"
      - "/site"
      - "/web"
      - "/server"
      - "/api"
      - "/packages/*"
      - "/apps/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      npm-patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      npm-security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  # ── pip ────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/scripts"
      - "/server"
      - "/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      pip-patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      pip-security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  # ── GitHub Actions ─────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"