# Dependabot configuration template — Veteran Vectors
#
# Edit THIS file in templates-skills, then re-sync to each consumer repo.
#
# Coverage: only the repo root is scanned per ecosystem. Subproject paths
# were removed 2026-05-15 — when ALL listed directories are missing,
# Dependabot aborts the entire run ("dependency_file_not_found"). With
# directory: "/" (singular), Dependabot skips silently if no manifest
# is present, so repos with no code never fail their Dependabot runs.
# Repos with subproject manifests (e.g. AC/Predictive Analysis Dashboard)
# need per-repo overrides to scan beyond root.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    groups:
      npm-patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
      npm-security:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
          - "major"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pip"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      pip-patch-and-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
