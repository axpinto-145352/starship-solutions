# ─────────────────────────────────────────────────────────────
# Auto-synced per-repo Dependabot config.
# Ecosystems are included only if the matching manifest is present
# at the repo root. With `directory: /` (singular), Dependabot v2
# ABORTS the entire run when the manifest is missing, so omitting
# the ecosystem entirely is the only way to keep the run green.
# Generated: 2026-05-15T16:54:10Z
# ─────────────────────────────────────────────────────────────

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
