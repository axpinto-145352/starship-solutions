<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050a15"/>
      <stop offset="100%" style="stop-color:#0d1f3c"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0a500"/>
      <stop offset="100%" style="stop-color:#ffc145"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="8" cy="8" r="1" fill="white" opacity="0.6"/>
  <circle cx="56" cy="12" r="1.2" fill="white" opacity="0.5"/>
  <circle cx="12" cy="52" r="1" fill="white" opacity="0.4"/>
  <circle cx="52" cy="48" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="48" cy="8" r="0.8" fill="white" opacity="0.5"/>
  <!-- Rocket -->
  <g transform="translate(16, 12) rotate(45, 16, 20)">
    <!-- Body -->
    <ellipse cx="16" cy="20" rx="8" ry="16" fill="url(#rocket)"/>
    <!-- Nose -->
    <path d="M16 4 L12 12 L20 12 Z" fill="#ffc145"/>
    <!-- Window -->
    <circle cx="16" cy="16" r="4" fill="#0d1f3c"/>
    <circle cx="16" cy="16" r="2.5" fill="#4d8ef7"/>
    <!-- Fins -->
    <path d="M8 28 L4 36 L12 32 Z" fill="#f0a500"/>
    <path d="M24 28 L28 36 L20 32 Z" fill="#f0a500"/>
    <!-- Flame -->
    <ellipse cx="16" cy="38" rx="4" ry="6" fill="#ff6b35"/>
    <ellipse cx="16" cy="36" rx="2.5" ry="4" fill="#ffc145"/>
  </g>
</svg>
